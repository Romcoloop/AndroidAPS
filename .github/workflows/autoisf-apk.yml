name: AutoISF APK

# Builds signed AAPS APKs (phone + wear) from this repository and keeps it as a download on the run page.
# Start it by hand: Actions -> AutoISF APK -> Run workflow.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the .jks file, base64 encoded
#   KEYSTORE_PASSWORD  password of the keystore
#   KEY_ALIAS          alias of the key (for example key0)
#   KEY_PASSWORD       password of the key
# Use the same keystore as the APK on the phone, or the new APK cannot be installed over it.
# Optional fifth secret RCLONE_GDRIVE_TOKEN: the APKs are also copied to Google Drive, see the
# "Copy APK to Google Drive" step.

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
      runTests:
        description: 'Run the APS plugin tests first (JVM and Android host tests)'
        required: true
        default: true
        type: boolean
      fullTests:
        description: 'Run the whole unit test suite of the project first (about 40 minutes)'
        required: true
        default: false
        type: boolean

concurrency:
  group: autoisf-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_VARIANT: ${{ github.event.inputs.buildVariant }}
      # A step condition cannot read secrets, so the job env keeps a flag for the Google Drive step.
      HAS_RCLONE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN != '' }}
    steps:
      - name: Check secrets
        env:
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=0
          [ -n "$S_KEYSTORE_BASE64" ] || { echo "Missing secret: KEYSTORE_BASE64"; MISSING=1; }
          [ -n "$S_KEYSTORE_PASSWORD" ] || { echo "Missing secret: KEYSTORE_PASSWORD"; MISSING=1; }
          [ -n "$S_KEY_ALIAS" ] || { echo "Missing secret: KEY_ALIAS"; MISSING=1; }
          [ -n "$S_KEY_PASSWORD" ] || { echo "Missing secret: KEY_PASSWORD"; MISSING=1; }
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All secrets are set."

      - name: Decode keystore
        env:
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          # Windows tools may add line breaks or spaces; remove them before decoding.
          printf '%s' "$S_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Check keystore, alias and passwords
        env:
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          if ! jarsigner -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$S_KEYSTORE_PASSWORD" -keypass "$S_KEY_PASSWORD" \
              dummy.jar "$S_KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore, alias or one of the passwords is wrong."
            exit 1
          fi
          rm -f dummy.jar dummy.txt
          echo "Keystore is OK."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Gradle settings for the runner
        run: |
          chmod +x gradlew
          # gradle.properties asks for 8 GB and 12 workers. A runner for a private repository
          # can have less memory, so use smaller values here.
          MEM_GB=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          if [ "$MEM_GB" -ge 14 ]; then HEAP=8g; WORKERS=4; else HEAP=4g; WORKERS=2; fi
          echo "Runner memory: ${MEM_GB} GB, Gradle heap: $HEAP, workers: $WORKERS"
          echo "GRADLE_ARGS=--no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx$HEAP -Dorg.gradle.workers.max=$WORKERS -Dkotlin.compiler.execution.strategy=in-process" >> "$GITHUB_ENV"

      - name: Run APS plugin tests
        if: ${{ github.event.inputs.runTests == 'true' }}
        run: |
          set -o pipefail
          ./gradlew $GRADLE_ARGS :plugins:aps:jvmTest :plugins:aps:testAndroidHostTest --continue 2>&1 | tee aps-tests.log

      # The full log is only on the run page. Compile errors and failed tests are repeated here as
      # annotations, so they show on the run summary and can be read through the API.
      - name: Errors as annotations
        if: ${{ failure() && github.event.inputs.runTests == 'true' }}
        run: |
          # GitHub keeps at most 10 error annotations per step, so compile errors come first.
          {
            grep -E '^e: ' aps-tests.log | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2::\4#'
            grep -B1 -E 'AssertionError|AssertionFailedError|^[A-Za-z.]*Exception' aps-tests.log | sed 's/^/::error ::/'
            grep -A6 'What went wrong' aps-tests.log | grep -v '^> Task' | sed 's/^/::error ::/'
          } | head -10 || true

      # The same gradle tasks as .github/workflows/unit-tests.yml. That project workflow is skipped in
      # a fork, so this is the way to run the whole suite here. Keep the task list the same.
      # --continue: gradle goes on after the first failing module, so one run shows every failure.
      # The memory settings are the ones of the project workflow, made for a hosted runner.
      - name: Run the whole unit suite
        if: ${{ github.event.inputs.fullTests == 'true' }}
        run: |
          set -o pipefail
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Xss4m
          org.gradle.workers.max=3
          kotlin.daemon.jvm.options=-Xmx4g
          EOF
          ./gradlew --console=plain --no-daemon --continue \
            testFullDebugUnitTest testDebugUnitTest jvmTest testAndroidHostTest :desktop:shell:test \
            2>&1 | tee full-tests.log

      - name: Whole suite failures as annotations
        if: ${{ failure() && github.event.inputs.fullTests == 'true' }}
        run: |
          {
            echo "### Failed tests and compile errors"
            grep -E ' FAILED$|^e: ' full-tests.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY" || true
          {
            grep -E '^e: ' full-tests.log | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2::\4#'
            grep -E ' FAILED$' full-tests.log | sort -u | sed 's/^/::error ::/'
            grep -A6 'What went wrong' full-tests.log | grep -v '^> Task' | sed 's/^/::error ::/'
          } | head -10 || true

      - name: Keep the whole suite test reports
        if: ${{ always() && github.event.inputs.fullTests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            full-tests.log
          retention-days: 7

      - name: Build APK
        env:
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew $GRADLE_ARGS ":app:assemble${BUILD_VARIANT}" ":wear:assemble${BUILD_VARIANT}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$S_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$S_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$S_KEY_PASSWORD" 2>&1 | tee build.log

      - name: Build errors as annotations
        if: ${{ failure() }}
        run: |
          [ -f build.log ] || exit 0
          {
            grep -E '^e: ' build.log | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2::\4#'
            grep -E '^e: |error:|Error:|\[ksp\]|\[Metro\]' build.log | grep -v '^e: file' | sed 's/^/::error ::/'
            grep -A8 'What went wrong' build.log | grep -v '^> Task' | sed 's/^/::error ::/'
          } | head -10 || true

      - name: Name the APK
        run: |
          FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          STAMP=$(TZ=Europe/Bratislava date +%Y-%m-%d_%H-%M)
          NAME="aaps-autoisf-${STAMP}-${SHORT_SHA}-${BUILD_VARIANT}"
          mkdir -p out
          cp app/build/outputs/apk/$FLAVOR/$TYPE/*.apk "out/$NAME.apk"
          cp wear/build/outputs/apk/$FLAVOR/$TYPE/*.apk "out/$NAME-wear.apk"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

      # Copies the two APKs to Google Drive, folder AAPS-builds/<branch>/, through rclone with the
      # owner's own Drive token (secret RCLONE_GDRIVE_TOKEN, scope drive.file: rclone sees only what
      # it uploaded itself). The token is the "token = {...}" line of `rclone config show gdrive`.
      # Without the secret the step is skipped; a Drive error does not fail the run, the APK is
      # still on the run page.
      - name: Copy APK to Google Drive
        if: ${{ env.HAS_RCLONE_TOKEN == 'true' }}
        continue-on-error: true
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive.file
          export RCLONE_CONFIG_GDRIVE_TOKEN="$RCLONE_GDRIVE_TOKEN"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          rclone copy out "gdrive:AAPS-builds/$BRANCH/" --include '*.apk' --drive-use-trash=false -v
          echo "Copied to Google Drive: AAPS-builds/$BRANCH/$APK_NAME.apk and $APK_NAME-wear.apk"

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
