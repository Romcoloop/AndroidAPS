name: AutoISF full tests

# Runs the whole unit test suite of the project on this fork, by hand: Actions -> AutoISF full tests
# -> Run workflow.
#
# Why this file exists: the project workflow "Unit tests (JVM)" does not run inside a fork unless the
# repository variable RUN_CI is true. This workflow runs the same gradle tasks, only by hand and
# without the coverage steps. The tasks are the ones in .github/workflows/unit-tests.yml. Keep the
# two lists the same.
#
# The APK workflow ("AutoISF APK") runs only the :plugins:aps tests. Use this one before you trust a
# change that touches settings keys, a signature or a rename.

on:
  workflow_dispatch:

concurrency:
  group: autoisf-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Gradle settings for the runner
        run: |
          chmod +x gradlew
          # gradle.properties asks for 8 GB and 12 workers. Use smaller values on a hosted runner.
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Xss4m
          org.gradle.workers.max=3
          kotlin.daemon.jvm.options=-Xmx4g
          EOF
          nproc; free -g

      # --continue: gradle goes on after the first failing module, so one run shows every failure.
      - name: Run the unit suite
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon --continue \
            testFullDebugUnitTest testDebugUnitTest jvmTest testAndroidHostTest :desktop:shell:test \
            2>&1 | tee unit-tests.log

      # The full log is only on the run page. Compile errors and failed tests are repeated here as
      # annotations (GitHub keeps at most 10 per step) and all failed tests go to the run summary.
      - name: Failures as annotations
        if: ${{ failure() }}
        run: |
          {
            echo "### Failed tests and compile errors"
            grep -E ' FAILED$|^e: ' unit-tests.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY" || true
          {
            grep -E '^e: ' unit-tests.log | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2::\4#'
            grep -E ' FAILED$' unit-tests.log | sort -u | sed 's/^/::error ::/'
            grep -A6 'What went wrong' unit-tests.log | grep -v '^> Task' | sed 's/^/::error ::/'
          } | head -10 || true

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            unit-tests.log
          retention-days: 7
